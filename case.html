    try {

      if (SUPABASE_URL && !SUPABASE_URL.includes("your-prana-project") && window.supabase) {

        pranaSupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      }

    const uploadImagesToSupabase = async (clinic, patientId, visitId, images) => {

      const urls = [];

      const bucketName = ACTIVE_CONFIG.supabase?.bucket || "clinical-images";



      for (const img of images) {

        let uploaded = false;



        // 1. Try PHP MySQL server upload (Direct cPanel storage)

        try {

          const fd = new FormData();

          fd.append('file', img.blob, img.name);

          fd.append('patientId', patientId);

          fd.append('visitId', visitId);



          const res = await fetch(`${API_BASE}/upload.php`, {

            method: 'POST',

            body: fd

          });



          if (res.ok) {

            const data = await res.json();

            if (data && data.status === 'success' && data.url) {

              urls.push(data.url);

              uploaded = true;

            }

          }

        } catch (phpErr) {

          console.warn("PHP upload notice, trying cloud/local fallback:", phpErr);

        }



        if (uploaded) continue;



        // 2. Try Supabase Storage if configured

        if (pranaSupabaseClient && SUPABASE_URL && !SUPABASE_URL.includes("your-prana-project")) {

          try {

            const filePath = `clinics/${clinic}/patients/${patientId}/visits/${visitId}/${Date.now()}_${img.name}`;

            const { error } = await pranaSupabaseClient.storage

              .from(bucketName)

              .upload(filePath, img.blob, {

                contentType: "image/webp",

                upsert: true

              });



            if (!error) {

              const { data } = supabase.storage.from(bucketName).getPublicUrl(filePath);

              if (data && data.publicUrl) {

                urls.push(data.publicUrl);

                continue;

              }

            } else {

              console.warn("Supabase upload returned error, using local fallback:", error);

            }

          } catch (e) {

            console.warn("Supabase error during upload, falling back:", e);

          }

        }



        // 3. Safe Fallback: Convert Blob to Data URL so photo is never lost!

        try {

          const reader = new FileReader();

          const dataUrl = await new Promise((resolve) => {

            reader.onloadend = () => resolve(reader.result);

            reader.readAsDataURL(img.blob);

          });

          urls.push(dataUrl);

        } catch (readErr) {

          console.error("Failed to read image locally:", readErr);

        }

      }



      return urls;

    };

const CustomCalendar = ({ value, onChange, onClose }) => {

  const [current, setCurrent] = useState(

    value ? new Date(value) : new Date()

  );



  const year = current.getFullYear();

  const month = current.getMonth();



  const firstDayIndex = new Date(year, month, 1).getDay();

  const daysInMonth = new Date(year, month + 1, 0).getDate();



  const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];



  const generateDays = () => {

    const days = [];

    for (let i = 0; i < firstDayIndex; i++) {

      days.push(null);

    }

    for (let d = 1; d <= daysInMonth; d++) {

      days.push(d);

    }

    return days;

  };



  const formatted = (d) =>

    `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;



  return (

    <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">

      <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100">



        {/* Header */}

        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">

          <div className="flex items-center gap-1">

            <button

              type="button"

              onClick={() => setCurrent(new Date(year - 1, month, 1))}

              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"

              title="Previous Year"

            >

              <i className="fa-solid fa-angles-left text-xs"></i>

            </button>

            <button

              type="button"

              onClick={() => setCurrent(new Date(year, month - 1, 1))}

              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"

              title="Previous Month"

            >

              <i className="fa-solid fa-chevron-left text-xs"></i>

            </button>

          </div>



          <h3 className="font-black text-sm text-[#073B42]">

            {current.toLocaleString("default", { month: "long" })} {year}

          </h3>



          <div className="flex items-center gap-1">

            <button

              type="button"

              onClick={() => setCurrent(new Date(year, month + 1, 1))}

              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"

              title="Next Month"

            >

              <i className="fa-solid fa-chevron-right text-xs"></i>

            </button>

            <button

              type="button"

              onClick={() => setCurrent(new Date(year + 1, month, 1))}

              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"

              title="Next Year"

            >

              <i className="fa-solid fa-angles-right text-xs"></i>

            </button>

          </div>

        </div>



        {/* Weekdays */}

        <div className="grid grid-cols-7 text-center text-[11px] font-black text-slate-400 mb-2">

          {weekdays.map((w) => (

            <div key={w} className="py-1">{w}</div>

          ))}

        </div>



        {/* Dates */}

        <div className="grid grid-cols-7 gap-1.5 text-center text-xs">

          {generateDays().map((d, i) =>

            d ? (

              <button

                key={i}

                type="button"

                onClick={() => {

                  onChange(formatted(d));

                  if (onClose) onClose();

                }}

                className={`py-2 rounded-xl font-bold transition cursor-pointer flex items-center justify-center ${

                  value === formatted(d)

                    ? "bg-[#073B42] text-white shadow-md shadow-teal-900/30 font-black"

                    : "text-slate-700 hover:bg-teal-50 hover:text-teal-900"

                }`}

              >

                {d}

              </button>

            ) : (

              <div key={i}></div>

            )

          )}

        </div>



        {/* Footer Actions */}

        <div className="mt-5 pt-3 border-t border-slate-100 flex items-center gap-2">

          <button

            type="button"

            onClick={() => {

              const today = new Date();

              const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

              onChange(todayStr);

              if (onClose) onClose();

            }}

            className="flex-1 py-2 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 font-black text-xs transition cursor-pointer"

          >

            Today

          </button>

          <button

            type="button"

            onClick={onClose}

            className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition cursor-pointer"

          >

            Cancel

          </button>

        </div>



      </div>

    </div>

  );

};

      } else {

        const local = JSON.parse(localStorage.getItem('prana_offline_cases') || '[]');
        setCases(local);

      setLoading(false);

            img.onload = () => {

      const RxSection = React.memo(({ title, type, list, update, add, remove, theme, isSos }) => {

        // Older/API records may omit a prescription category or store it as an object/string.

        const safeList = (() => {

          let value = list;

          if (typeof value === 'string') {

            try { value = JSON.parse(value); } catch (e) { value = []; }

          }

          if (!Array.isArray(value)) {

            value = value && typeof value === 'object' ? Object.values(value) : [];

          }

          return value.filter(rx => rx && typeof rx === 'object' && !Array.isArray(rx)).map(rx => ({

            ...rx,

            name: rx.name ?? rx.medicine ?? rx.drug ?? '',

            dose: rx.dose ?? rx.dosage ?? '',

        // ✅ Ensure visiting the patient report always starts from the very top section

        useEffect(() => {

          const resetScroll = () => {

            const el = document.getElementById("appContainer");

            if (el) el.scrollTop = 0;

            window.scrollTo(0, 0);

            document.documentElement.scrollTop = 0;

            document.body.scrollTop = 0;

        const [previewImage, setPreviewImage] = useState(null);

        const [downloadToast, setDownloadToast] = useState(false);



        const downloadImage = async (url, filename) => {

          try {

            const res = await fetch(url);

            const blob = await res.blob();



            // ✅ Mobile: use Web Share API (triggers Android/iOS save to gallery)

            if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {

              const file = new File([blob], filename, { type: blob.type });

              await navigator.share({ files: [file], title: filename });

              setDownloadToast(true);

              setTimeout(() => setDownloadToast(false), 2500);

              return;

            }



            // ✅ Desktop: blob download

            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');

            a.href = blobUrl;

            a.download = filename;

            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);

            URL.revokeObjectURL(blobUrl);

            setDownloadToast(true);

            setTimeout(() => setDownloadToast(false), 2500);

          } catch (err) {

            console.error('Download failed:', err);

          }

        };

              id: v.id || k

            })).sort((a, b) => (new Date(b.date || b.createdAt || 0)) - (new Date(a.date || a.createdAt || 0)));

          document.body.removeChild(link);

          URL.revokeObjectURL(blobUrl);

        }, 3000);

// Dismiss loading screen after mounting

(function() {

    function hideLoader() {

        var loader = document.getElementById('app-loading-screen');

        if (loader) {

            loader.style.opacity = '0';

            setTimeout(function() { loader.style.display = 'none'; }, 400);

        }

    }

    if (document.readyState === 'complete') {

        setTimeout(hideLoader, 300);

    } else {

        window.addEventListener('load', function() { setTimeout(hideLoader, 300); });

    }

    setTimeout(hideLoader, 2000); // hard fallback

})();



// Ensure pure live operation: actively unregister any existing service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
            registration.unregister();
            console.log('Unregistered SW:', registration.scope);
        }
    });
}

</script>
