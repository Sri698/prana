<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11796c">
  <title>Admin Setup · Prana Homeo Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f4f8f6;
      color: #172d2a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #fff;
      border: 1px solid #dceae4;
      border-radius: 20px;
      padding: 32px;
      max-width: 540px;
      box-shadow: 0 12px 36px rgba(17,121,108,0.08);
    }
    h1 { font-size: 24px; margin: 0 0 12px; color: #11796c; }
    p { font-size: 14.5px; line-height: 1.6; color: #556c66; margin: 0 0 16px; }
    code { background: #eaf6f2; color: #0b5b52; padding: 3px 7px; border-radius: 6px; font-size: 13.5px; font-weight: 600; }
    .btn { display: inline-block; padding: 10px 18px; background: #11796c; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Doctor Workspace Setup</h1>
    <p>Please configure <code>PRANA_ADMIN_PASSWORD</code> and <code>PRANA_ADMIN_USER</code> in your <code>.env</code> file before launching production deployment.</p>
    <p>Default credentials (<code>doctor</code> / <code>prana2026</code>) are pre-configured in the development <code>.env</code> file.</p>
    <a class="btn" href="/admin/login">Proceed to Sign In →</a>
  </div>
</body>
</html>
