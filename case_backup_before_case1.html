    const RESOLVED_SERVER_BASE = (() => {
      if (window.PRANA_CONFIG && window.PRANA_CONFIG.bookingBaseUrl) return window.PRANA_CONFIG.bookingBaseUrl;
      const origin = window.location.origin;
      if (!origin || origin.startsWith('file:') || origin.includes('localhost') || origin.includes('127.0.0.1') || origin.startsWith('capacitor:')) {

          if (data && data.status === 'healthy') {

        supabase: {
          url: "https://your-prana-project.supabase.co",
          anonKey: "YOUR_PRANA_SUPABASE_ANON_KEY",
          bucket: "clinical-images"
        }
      };
    };

    const ACTIVE_CONFIG = getActiveConfig();
    const firebaseConfig = ACTIVE_CONFIG.firebase;

    // Initialize Firebase
    let auth = null;
    let rtdb = null;
    let firebaseAvailable = false;

    try {
      if (firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      rtdb = firebase.database();

    } catch (fbErr) {
      console.warn("Firebase initialization notice:", fbErr.message);

    // Initialize Supabase Storage
    const SUPABASE_URL = ACTIVE_CONFIG.supabase?.url || "";
    const SUPABASE_ANON_KEY = ACTIVE_CONFIG.supabase?.anonKey || "";
    let pranaSupabaseClient = null;
    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes("your-prana-project") && window.supabase) {
        pranaSupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (sbErr) {
      console.warn("Supabase initialization notice:", sbErr.message);
    }
    const uploadImagesToSupabase = async (clinic, patientId, visitId, images) => {
      const urls = [];
      const bucketName = ACTIVE_CONFIG.supabase?.bucket || "clinical-images";

      for (const img of images) {
        let uploaded = false;

        // 1. Try PHP MySQL server upload (Direct cPanel storage)
        try {
          const fd = new FormData();
          fd.append('file', img.blob, img.name);
          fd.append('patientId', patientId);
          fd.append('visitId', visitId);

          const res = await fetch(`${API_BASE}/upload.php`, {
            method: 'POST',
            body: fd
          });

          if (res.ok) {
            const data = await res.json();
            if (data && data.status === 'success' && data.url) {
              urls.push(data.url);
              uploaded = true;
            }
          }
        } catch (phpErr) {
          console.warn("PHP upload notice, trying cloud/local fallback:", phpErr);
        }

        if (uploaded) continue;

        // 2. Try Supabase Storage if configured
        if (pranaSupabaseClient && SUPABASE_URL && !SUPABASE_URL.includes("your-prana-project")) {
          try {
            const filePath = `clinics/${clinic}/patients/${patientId}/visits/${visitId}/${Date.now()}_${img.name}`;
            const { error } = await pranaSupabaseClient.storage
              .from(bucketName)
              .upload(filePath, img.blob, {
                contentType: "image/webp",
                upsert: true
              });

            if (!error) {
              const { data } = supabase.storage.from(bucketName).getPublicUrl(filePath);
              if (data && data.publicUrl) {
                urls.push(data.publicUrl);
                continue;
              }
            } else {
              console.warn("Supabase upload returned error, using local fallback:", error);
            }
          } catch (e) {
            console.warn("Supabase error during upload, falling back:", e);
          }
        }

        // 3. Safe Fallback: Convert Blob to Data URL so photo is never lost!
        try {
          const reader = new FileReader();
          const dataUrl = await new Promise((resolve) => {
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(img.blob);
          });
          urls.push(dataUrl);
        } catch (readErr) {
          console.error("Failed to read image locally:", readErr);
        }
      }

      return urls;
    };

const CustomCalendar = ({ value, onChange, onClose }) => {
  const [current, setCurrent] = useState(
    value ? new Date(value) : new Date()
  );

  const year = current.getFullYear();
  const month = current.getMonth();

  const firstDayIndex = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

  const generateDays = () => {
    const days = [];
    for (let i = 0; i < firstDayIndex; i++) {
      days.push(null);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      days.push(d);
    }
    return days;
  };

  const formatted = (d) =>
    `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  return (
    <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
      <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100">

        {/* Header */}
        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
          <div className="flex items-center gap-1">
            <button
              type="button"
              onClick={() => setCurrent(new Date(year - 1, month, 1))}
              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"
              title="Previous Year"
            >
              <i className="fa-solid fa-angles-left text-xs"></i>
            </button>
            <button
              type="button"
              onClick={() => setCurrent(new Date(year, month - 1, 1))}
              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"
              title="Previous Month"
            >
              <i className="fa-solid fa-chevron-left text-xs"></i>
            </button>
          </div>

          <h3 className="font-black text-sm text-[#073B42]">
            {current.toLocaleString("default", { month: "long" })} {year}
          </h3>

          <div className="flex items-center gap-1">
            <button
              type="button"
              onClick={() => setCurrent(new Date(year, month + 1, 1))}
              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"
              title="Next Month"
            >
              <i className="fa-solid fa-chevron-right text-xs"></i>
            </button>
            <button
              type="button"
              onClick={() => setCurrent(new Date(year + 1, month, 1))}
              className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition cursor-pointer"
              title="Next Year"
            >
              <i className="fa-solid fa-angles-right text-xs"></i>
            </button>
          </div>
        </div>

        {/* Weekdays */}
        <div className="grid grid-cols-7 text-center text-[11px] font-black text-slate-400 mb-2">
          {weekdays.map((w) => (
            <div key={w} className="py-1">{w}</div>
          ))}
        </div>

        {/* Dates */}
        <div className="grid grid-cols-7 gap-1.5 text-center text-xs">
          {generateDays().map((d, i) =>
            d ? (
              <button
                key={i}
                type="button"
                onClick={() => {
                  onChange(formatted(d));
                  if (onClose) onClose();
                }}
                className={`py-2 rounded-xl font-bold transition cursor-pointer flex items-center justify-center ${
                  value === formatted(d)
                    ? "bg-[#073B42] text-white shadow-md shadow-teal-900/30 font-black"
                    : "text-slate-700 hover:bg-teal-50 hover:text-teal-900"
                }`}
              >
                {d}
              </button>
            ) : (
              <div key={i}></div>
            )
          )}
        </div>

        {/* Footer Actions */}
        <div className="mt-5 pt-3 border-t border-slate-100 flex items-center gap-2">
          <button
            type="button"
            onClick={() => {
              const today = new Date();
              const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
              onChange(todayStr);
              if (onClose) onClose();
            }}
            className="flex-1 py-2 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 font-black text-xs transition cursor-pointer"
          >
            Today
          </button>
          <button
            type="button"
            onClick={onClose}
            className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition cursor-pointer"
          >
            Cancel
          </button>
        </div>

      </div>
    </div>
  );
};

      ];
      for (const ep of endpoints) {

            const json = await res.json();
            if (json && Array.isArray(json.data)) {
              setAppointments(json.data);
              try {
                localStorage.setItem('prana_cached_appointments', JSON.stringify(json.data));
              } catch(e) {}
              loaded = true;
              break;

          }
        } catch(err) {}
      }

      console.warn("Realtime appointment fetch error:", e);
    }

    if (!loaded) {
      try {
        const cached = localStorage.getItem('prana_cached_appointments');

          if (Array.isArray(parsed)) {
            setAppointments(parsed);

        const downloadImage = async (url, filename) => {
          try {
            const res = await fetch(url);
            const blob = await res.blob();

            // ✅ Mobile: use Web Share API (triggers Android/iOS save to gallery)
            if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {
              const file = new File([blob], filename, { type: blob.type });
              await navigator.share({ files: [file], title: filename });
              setDownloadToast(true);
              setTimeout(() => setDownloadToast(false), 2500);
              return;
            }

            // ✅ Desktop: blob download
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            setDownloadToast(true);
            setTimeout(() => setDownloadToast(false), 2500);
          } catch (err) {
            console.error('Download failed:', err);
          }
        };

      doc.addPage();
      y = 25;

    y += 16;

    doc.setFont("helvetica", "bold");
    doc.text(label, margin + 2, y);
    doc.setFont("helvetica", "normal");
    doc.text(value || "---", margin + 60, y);
    y += 8;
  };

  const paragraphBlock = (text) => {
    const split = doc.splitTextToSize(text || "---", contentWidth - 10);

    doc.line(M, y + 4, W - M, y + 4);

    y += 12;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);

    form.medicines.forEach((m, i) => {

      doc.text(m.potency || "-", 135, y);
      doc.text(m.dose || "3-0-3", W - M, y, { align: "right" });
      y += 12;
    });

    // =========================
    // SIGNATURE (BALANCED)
    // =========================

    y = H - 40;

    doc.line(W - 70, y, W - M, y);
    doc.setFontSize(9);
    doc.text("Doctor Signature", W - 70, y + 5);

    doc.save(`${form.patientName || "Prescription"}.pdf`);

        onClick={() => setView("PHARMACY")}
        className={`text-left w-full px-4 py-3 rounded-xl transition flex items-center gap-3 ${
          view === "PHARMACY"
            ? "bg-white/10 backdrop-blur text-white font-bold"
            : "text-slate-400 hover:bg-white/5 hover:text-white"
        }`}
      >
        <i className="fa-solid fa-pills text-sm text-amber-400"></i>
        <span>Pharmacy Inventory</span>
      </button>

      <button
        onClick={() => setView("PRESCRIPTION")}
        className={`text-left w-full px-4 py-3 rounded-xl transition flex items-center gap-3 ${
          view === "PRESCRIPTION"
            ? "bg-white/10 backdrop-blur text-white font-bold"
            : "text-slate-400 hover:bg-white/5 hover:text-white"
        }`}
      >
        <i className="fa-solid fa-file-prescription text-sm text-purple-400"></i>
        <span>E-Prescriptions</span>
      </button>
    </nav>

    <div className="mt-auto pt-4 border-t border-white/10 space-y-2 text-xs">
      <div className="px-3 py-2.5 rounded-xl bg-white/5 border border-white/10">
        <div className="flex items-center justify-between">
          <span className="font-bold text-slate-200">Prana Homeo Care</span>
          <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            Live Sync
          </span>
        </div>
        <p className="text-[10px] text-slate-400 mt-1">Clinical EHR &bull; Offline Sync</p>
      </div>

      <button
        onClick={() => {
          auth.signOut();
          setView("LOGIN");
        }}
        className="w-full py-2.5 px-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-xs transition flex items-center justify-center gap-2"
      >
        <i className="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  {/* MAIN CONTENT */}
  <div
    id="appContainer"
    className="flex-1 relative overflow-x-hidden overflow-y-auto h-screen"

  >

          {view === 'LOGIN' && <Login />}

          {view === 'PORTAL_SELECT' && (
            <PortalSelect setView={setView} setClinic={setClinic} />
          )}

          {view === 'APPOINTMENTS' && (
            <AppointmentsAdmin
              db={db}
              setView={setView}
              setActivePatientId={setActivePatientId}
              setRegModal={setRegModal}
            />
          )}

          {view === 'HOME' && (
            <Home
              db={db}
              search={search}
              setSearch={setSearch}
              setActivePatientId={setActivePatientId}
              setView={setView}
              regModal={regModal}
              setRegModal={setRegModal}
              clinic={clinic}
              setClinic={setClinic}
              setDb={setDb}
              loadingPatients={loadingPatients}
            />


          )}


          {view === 'TIMELINE' && <Timeline patient={patient} />}

          {view === 'CONSULTATION' && <Consultation />}

          {view === 'REPORT' && <Report />}

{view === "PHARMACY" && <Pharmacy />}

{view === "PRESCRIPTION" && <Prescription />}
          {regModal.show && <RegistrationModal />}
          {pharmacyModal.show && <PharmacyModal />}

{appAlert && (
            <div className="fixed inset-0 z-[600] flex items-center justify-center px-6">
              <div
                className="absolute inset-0 bg-black/50 backdrop-blur-sm"
                onClick={() => setAppAlert(null)}
              ></div>
              <div className="relative bg-white w-full max-w-[340px] rounded-3xl p-8 shadow-2xl text-center">
                <div className="w-14 h-14 rounded-2xl bg-red-50 flex items-center justify-center mx-auto mb-5">
                  <i className="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
                </div>
                <h3 className="text-base font-black text-slate-900 mb-2 tracking-tight">
                  Duplicate Reg ID
                </h3>
                <p className="text-sm text-slate-500 mb-7 leading-relaxed">
                  {appAlert}
                </p>
                <button
                  onClick={() => setAppAlert(null)}
                  className="w-full h-12 rounded-2xl bg-slate-900 text-white font-black text-xs uppercase tracking-widest active:scale-[0.97] transition"
                >
                  OK, Got It
                </button>
              </div>
            </div>
          )}
          
          <ConfirmModal />
</div>
        </div>
      );


    };



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  

// Dismiss loading screen after mounting
(function() {
    function hideLoader() {
        var loader = document.getElementById('app-loading-screen');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(function() { loader.style.display = 'none'; }, 400);
        }
    }
    if (document.readyState === 'complete') {
        setTimeout(hideLoader, 300);
    } else {
        window.addEventListener('load', function() { setTimeout(hideLoader, 300); });
    }
    setTimeout(hideLoader, 2000); // hard fallback
})();

</script>

</body>

</html>
